name: Build Smart Attendance APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Is button se aap jab chahein manually APK build kar sakte hain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Java 17 set up (Android Studio Ladybug / Koala / Hedgehog default)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # gradlew ko executable permission dena
      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      # Build APK (Tests aur lint bypass taaki dummy UI/incomplete logic par build na ruke)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -x test -x lint

      # Generate hue APK ko artifact ke roop me save karna
      - name: Upload Attendance APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Attendance-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
