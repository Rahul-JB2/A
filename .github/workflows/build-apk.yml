name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: gradle --version

      - name: Create test keystore
        run: |
          keytool -genkeypair -v -keystore test-release.keystore -storepass testpassword -alias testkey -keypass testpassword -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test, OU=Development, O=Local, L=Local, ST=Local, C=IN"
          cp test-release.keystore test-debug.keystore

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-teacher-attendance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
